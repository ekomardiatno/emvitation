name: Android Release CI/CD

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag matches package.json version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "Tag version: $TAG_VERSION"
          echo "Package.json version: $PACKAGE_VERSION"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "❌ Version mismatch! Tag ($TAG_VERSION) != package.json ($PACKAGE_VERSION)"
            exit 1
          fi

          echo "✅ Version match"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required env variables
        run: |
          missing=false

          check_var () {
            name=$1
            value=$2

            if [ -z "$value" ]; then
              echo "❌ Missing required env: $name"
              missing=true
            else
              echo "✅ $name is set"
            fi
          }

          check_var "API_URL" "${{ vars.API_URL }}"
          check_var "SPA_URL" "${{ vars.SPA_URL }}"
          check_var "GOOGLE_MAPS_API_KEY" "${{ secrets.GOOGLE_MAPS_API_KEY }}"
          check_var "API_NOAUTH_TOKEN" "${{ secrets.API_NOAUTH_TOKEN }}"
          check_var "WA_OTP_NUMBER" "${{ vars.WA_OTP_NUMBER }}"

          if [ "$missing" = true ]; then
            echo "🚫 Build failed بسبب missing environment variables"
            exit 1
          fi

      - name: Create .env file
        run: |
          cat <<EOF > .env
          API_URL=${{ vars.API_URL }}
          SPA_URL=${{ vars.SPA_URL }}
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          API_NOAUTH_TOKEN=${{ secrets.API_NOAUTH_TOKEN }}
          WA_OTP_NUMBER=${{ vars.WA_OTP_NUMBER }}
          EOF

          echo ".env created"
          cat .env \
            | sed 's/GOOGLE_MAPS_API_KEY=.*/GOOGLE_MAPS_API_KEY=***hidden***/' \
            | sed 's/API_NOAUTH_TOKEN=.*/API_NOAUTH_TOKEN=***hidden***/'

      - name: Verify env usage
        run: |
          grep API_URL .env

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/app/release.keystore

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Apply CI Gradle overrides
        run: |
          echo "" >> android/gradle.properties
          cat >> android/gradle.properties << 'EOF'
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          EOF

      - name: Build AAB and APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease

      - name: Rename build artifacts
        run: |
          APP_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          mv android/app/build/outputs/bundle/release/app-release.aab "android/app/build/outputs/bundle/release/${APP_NAME}-v${VERSION}.aab"
          mv android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/${APP_NAME}-v${VERSION}.apk"
          mv android/app/build/outputs/mapping/release/mapping.txt "android/app/build/outputs/mapping/release/${APP_NAME}-v${VERSION}-mapping.txt"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload mapping.txt artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapping-txt
          path: android/app/build/outputs/mapping/release/*-mapping.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/*-mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
